[project]
name = "longmemeval-harness"
version = "0.1.0"
description = "Reproducible LongMemEval harness — score memory systems (Lore, and later Mem0/Zep) through one pinned, cached judge with the same-judge discipline."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "The LoreGPT Authors" }]

# Harness-only runtime deps. The judge is the official LongMemEval judge (OpenAI GPT-4o snapshot); the answerer
# runs on our own stack (Anthropic); the Lore adapter drives the server through the published Python SDK. None
# of this reaches the shipped Lore product — it is the evaluation harness, not a library.
dependencies = [
  "openai>=1.50,<2",
  "anthropic>=0.40,<1",
  "huggingface-hub>=0.25,<1",
  "loregpt",
]

# Competitor memory systems are heavy (their own vector/graph stacks) and only a real competitor run needs
# them, so they are an optional extra rather than a base dependency — the keyless CI unit layer drives them
# through fakes and never installs them. `pip install longmemeval-harness[competitors]` for a real run.
[project.optional-dependencies]
competitors = [
  # Not ours and not Mem0's: spaCy's CLI module imports click directly, having relied on Typer to bring it
  # in, and current Typer no longer depends on click at all. `import spacy` therefore raises ModuleNotFound
  # on a clean install — which Mem0 catches and reports as "spaCy is not installed", so the entity leg goes
  # quiet for a reason that has nothing to do with Mem0. Naming click here restores the import. Remove it
  # when spaCy declares its own dependency.
  "click>=8.1",
  # Mem0's own extras, not decoration. Its retrieval is a three-leg hybrid — semantic, BM25 keyword, and an
  # entity boost — and each of the two non-semantic legs degrades to a no-op when its optional dependency is
  # missing: without `extras` (fastembed) the keyword search returns nothing, and without `nlp` (spaCy) the
  # entity extractor returns an empty list and query lemmatisation falls through. Both degrade with a log
  # line and no error, so a bare install measures a competitor running on one leg of three. Comparing that
  # against Lore's full hybrid would flatter Lore by construction, which is the one thing a parity
  # comparison must not do. The spaCy model itself is fetched by Mem0 on first use.
  "mem0ai[extras,nlp]>=2.0,<3",
]

[project.urls]
Repository = "https://github.com/lore-gpt/lore"
Issues = "https://github.com/lore-gpt/lore/issues"

# loregpt is not published to PyPI yet, so depend on the in-repo SDK via a path source (monorepo). When the
# SDK publishes, this becomes a normal version pin.
[tool.uv.sources]
loregpt = { path = "../clients/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["longmemeval"]

[tool.hatch.build.targets.wheel.force-include]
"longmemeval/py.typed" = "longmemeval/py.typed"

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["longmemeval", "tests"]

# mem0ai is an optional extra (not installed in the keyless dev/CI env); the adapter types against the local
# Mem0Like Protocol, not mem0's own types, so treat the package as untyped when it is absent.
[[tool.mypy.overrides]]
module = ["mem0.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
