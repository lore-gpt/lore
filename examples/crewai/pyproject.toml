[project]
name = "lore-example-crewai"
version = "0"
description = "A CrewAI crew that remembers what its previous run learned, through Lore."
requires-python = ">=3.10,<3.14"
# The SDK is installed from PyPI, exactly as a user would — not a path dependency — so an SDK
# regression surfaces in this example's CI. crewai is pinned exactly rather than by range: its
# BaseLLM surface changed inside the 1.x line and its own docs have not caught up, so a floating
# minor could break the offline stub below without any change here.
dependencies = [
    "loregpt>=0.1.0,<0.2.0",
    "crewai==1.15.10",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
# This is a runnable example, not a distributable package — don't try to build it.
package = false

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
