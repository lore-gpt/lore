# Local self-host topology for Lore.
#
#   docker compose -f infra/docker-compose.yml up --build --wait
#
# `--wait` returns once the server is healthy: paradedb accepting TCP, the schema
# migrated (serve --auto-migrate), and /healthz green. The worker starts only
# after the server is healthy (so the queue schema exists) and, like every
# service, restarts on failure — but it has no HTTP surface, so `--wait` does not
# gate on the worker independently. valkey and minio are started so the Phase 1
# topology is already in place; Phase 0 does not read or write them.
#
# lore-provision is a one-shot that runs after the server is healthy: it creates a
# first project and writes its id and API key to ./.lore/credentials so the
# quickstart is `up` then `cat ./.lore/credentials`, no hand-run SQL. It is
# idempotent — a second `up` finds the file and leaves the project untouched — and
# it never prints the token, so the secret stays out of the logs.
#
# The database credentials below are throwaway local-dev values, not secrets.
#
# The project name is what Docker Compose namespaces containers, networks and volumes by, and it is
# global to the machine — not scoped to this directory. This file and the one `lore init` prints are
# two different topologies (this one builds from source; that one pins a published image), so they must
# NOT share a name: under one name Compose treats them as the same stack, silently recreates the other's
# containers, and — because volumes are namespaced the same way — `down -v` here would drop the database
# of a quickstart running somewhere else on the machine. Hence `lore-dev` for the contributor stack and
# `lore` for the scaffold. A test asserts the two stay different.
name: lore-dev

services:
  paradedb:
    image: paradedb/paradedb:0.24.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lore
      POSTGRES_PASSWORD: lore
      POSTGRES_DB: lore
    healthcheck:
      # Force a TCP check (-h) so this only passes once Postgres accepts network
      # connections. The socket-only phase of first-time init would otherwise
      # report ready before the server can dial it over TCP.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lore -d lore"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - paradedb-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    # No healthcheck yet: nothing consumes minio in Phase 0, so `--wait` only
    # waits for it to start. Add a GET /minio/health/live probe when a service
    # begins depending on it.
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: lore
      MINIO_ROOT_PASSWORD: lore-local-dev
    volumes:
      - minio-data:/data

  lore-server:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["serve", "--auto-migrate"]
    environment:
      LORE_DATABASE_URL: postgres://lore:lore@paradedb:5432/lore?sslmode=disable
      LORE_ADDR: ":8080"
      LORE_VALKEY_URL: redis://valkey:6379
      # Embeddings default to the offline fixture. To enable semantic recall, export
      # LORE_EMBEDDING_* before `up`; the SAME values are passed to the worker below
      # so the query and the stored vectors share one vector space.
      LORE_EMBEDDING_PROVIDER: "${LORE_EMBEDDING_PROVIDER:-}"
      LORE_EMBEDDING_BASE_URL: "${LORE_EMBEDDING_BASE_URL:-}"
      LORE_EMBEDDING_MODEL: "${LORE_EMBEDDING_MODEL:-}"
      LORE_EMBEDDING_DIM: "${LORE_EMBEDDING_DIM:-}"
      LORE_EMBEDDING_SEND_DIMENSIONS: "${LORE_EMBEDDING_SEND_DIMENSIONS:-}"
      LORE_EMBEDDING_API_KEY: "${LORE_EMBEDDING_API_KEY:-}"
      # Extraction runs in the worker, not here — these two are passed so /healthz can report
      # which model is distilling this deployment's memories, which is otherwise unanswerable
      # of a running stack. They must be the SAME values the worker gets below, or the answer
      # describes a different deployment than the one doing the work. Deliberately NOT
      # ANTHROPIC_API_KEY: serve builds no extractor, so it has no use for the key.
      LORE_EXTRACTION_PROVIDER: "${LORE_EXTRACTION_PROVIDER:-}"
      LORE_EXTRACTION_MODEL: "${LORE_EXTRACTION_MODEL:-}"
      # How long the dense retrieval leg may take to embed the query before the read
      # proceeds without it. Unset uses 2s, which fits a hosted embedding endpoint; a
      # dropped leg is reported in the pack's `degraded` field.
      LORE_RETRIEVAL_PARTIAL_TIMEOUT: "${LORE_RETRIEVAL_PARTIAL_TIMEOUT:-}"
      # OpenTelemetry traces are off unless LORE_OTEL_ENABLED=true AND an OTLP endpoint
      # is set; export both before `up` to ship traces to a collector.
      LORE_OTEL_ENABLED: "${LORE_OTEL_ENABLED:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    ports:
      # Only the API port is published. /metrics listens on 9090 inside the container
      # and is deliberately NOT mapped: it is unauthenticated, so mapping it would put
      # it wherever the API is. A collector on this network scrapes lore-server:9090
      # and lore-worker:9090 directly.
      # The container always listens on 8080; the host port is overridable via
      # LORE_HTTP_PORT for when 8080 is already taken (e.g. a local Apache/nginx).
      - "${LORE_HTTP_PORT:-8080}:8080"
    depends_on:
      paradedb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/lore", "health"]
      interval: 3s
      timeout: 3s
      retries: 20

  lore-worker:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["worker"]
    environment:
      LORE_DATABASE_URL: postgres://lore:lore@paradedb:5432/lore?sslmode=disable
      # Same working-memory stripe as lore-server: the worker routes kind:"state" events to it
      # when healthy and to a durable claim otherwise. Omitting it here would leave the worker
      # silently cacheless while /healthz — which reports the SERVER's view — still reads "ok".
      LORE_VALKEY_URL: redis://valkey:6379
      # Extraction runs HERE, not in serve, so these belong to the worker. Distillation defaults to
      # the offline fixture; export LORE_EXTRACTION_PROVIDER=anthropic with ANTHROPIC_API_KEY before
      # `up` for real LLM extraction. The key is provider-native (not LORE_-prefixed) so an operator
      # who already exports it needs no extra configuration.
      LORE_EXTRACTION_PROVIDER: "${LORE_EXTRACTION_PROVIDER:-}"
      LORE_EXTRACTION_MODEL: "${LORE_EXTRACTION_MODEL:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # How much one pass distils and how much room its answer has. Unset uses the built-in pair; raise
      # the ceiling (or lower the window) for events that carry a lot of text. A pass that overruns the
      # ceiling halves its window and retries, so these only have to be roughly right.
      LORE_EXTRACTION_MAX_TOKENS: "${LORE_EXTRACTION_MAX_TOKENS:-}"
      LORE_EXTRACTION_MAX_WINDOW: "${LORE_EXTRACTION_MAX_WINDOW:-}"
      # Must match lore-server's embedding config: the worker embeds stored memories,
      # serve embeds the query, and the two share one vector space only if identical.
      LORE_EMBEDDING_PROVIDER: "${LORE_EMBEDDING_PROVIDER:-}"
      LORE_EMBEDDING_BASE_URL: "${LORE_EMBEDDING_BASE_URL:-}"
      LORE_EMBEDDING_MODEL: "${LORE_EMBEDDING_MODEL:-}"
      LORE_EMBEDDING_DIM: "${LORE_EMBEDDING_DIM:-}"
      LORE_EMBEDDING_SEND_DIMENSIONS: "${LORE_EMBEDDING_SEND_DIMENSIONS:-}"
      LORE_EMBEDDING_API_KEY: "${LORE_EMBEDDING_API_KEY:-}"
      # OpenTelemetry traces are off unless LORE_OTEL_ENABLED=true AND an OTLP endpoint
      # is set; export both before `up` to ship traces to a collector.
      LORE_OTEL_ENABLED: "${LORE_OTEL_ENABLED:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    depends_on:
      paradedb:
        condition: service_healthy
      lore-server:
        condition: service_healthy

  lore-provision:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    # Create a first project and mint its API key, writing both to the mounted
    # credentials file. --out keeps the token out of stdout/logs, and the file is
    # the idempotency guard: on a second `up` the command finds it and no-ops, so
    # no duplicate project or key is ever created.
    command: ["provision", "--out", "/creds/credentials"]
    environment:
      LORE_DATABASE_URL: postgres://lore:lore@paradedb:5432/lore?sslmode=disable
    depends_on:
      # Wait for the server to be healthy, which means migrations have run and the
      # schema the provision writes into exists.
      lore-server:
        condition: service_healthy
    # A one-shot: run to completion once, do not restart. `up --wait` returns after
    # it exits 0.
    restart: "no"
    # The image runs as nonroot, but Docker creates the bind-mount source directory
    # as root, so a nonroot process cannot write the credentials file into it. Run
    # this one-shot as root so the write succeeds.
    #
    # What that leaves you with, precisely: the file is 0600 on POSIX hosts; the directory is
    # created by Docker and its mode is not enforced; on Windows the file inherits host ACLs.
    # There, how exposed the key is follows the ACL of whatever directory ./.lore lands in — a
    # shared location can leave it readable by other users on the machine (the README has an
    # optional icacls step). The same applies to ./.lore/credentials.bak, the second
    # key-bearing file a database reset leaves behind.
    user: "0:0"
    volumes:
      # Bind the credentials directory to the host so `cat` reads the minted key.
      # Relative paths resolve against the compose file's directory, so with
      # `-f infra/docker-compose.yml` the file lands at infra/.lore/credentials.
      - ./.lore:/creds

  # Optional diagnostics UI — remove or comment this block to run headless. It is a
  # read-only inspector for the local stack: browse memories, view run traces, and
  # soft-delete. Bound to localhost only — do not expose it to a network, and never
  # put an auth-less reverse proxy in front of it.
  lore-inspector:
    restart: unless-stopped
    build:
      context: ../inspector
    environment:
      # Reach the server over the compose network; read the provisioned project key
      # from the read-only credentials mount so it auto-connects with no browser step.
      LORE_API_URL: http://lore-server:8080
      LORE_CREDENTIALS_FILE: /creds/credentials
    ports:
      # Localhost bind only (not 0.0.0.0) — the diagnostics UI is unauthenticated.
      - "127.0.0.1:3000:3000"
    depends_on:
      lore-server:
        condition: service_healthy
      # Wait for the credentials file to exist before starting.
      lore-provision:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./.lore:/creds:ro

volumes:
  paradedb-data:
  minio-data:
